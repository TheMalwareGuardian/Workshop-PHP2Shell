services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php
    networks:
      - front
    restart: "no"
  php:
    build: .
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    mem_limit: 1g
    pids_limit: 128
    volumes:
      - vault-access:/opt/workshop/access:ro
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - front
      - vault-net
    # A malformed callback can crash the PHP CLI server (exit 139). Bring the same pinned image back without resetting the vault's runtime volume.
    restart: on-failure
  vault:
    build: ./Vault
    expose:
      - "9000"
    volumes:
      - vault-access:/run/workshop
    networks:
      - vault-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: "no"
networks:
  front: {}
  vault-net:
    internal: true
volumes:
  vault-access: {}
